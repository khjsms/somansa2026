<title>AI DLP Booth Q&amp;A</title>

<style>
/* Layout: booth kiosk for iPad — brand header band, language switch + topic chips, then a single column of tap-to-open questions */
:root{
  --bg:#F4F7FA; --surface:#FFFFFF; --ink:#14202B; --muted:#5A6B7A; --line:#DCE4EC;
  --brand:#0080C9; --brand-ink:#FFFFFF; --sky:#82D0F8; --coral:#EC6350;
  --chip:#E7F1F8; --open:#F0F7FC; --band:#0B5E92;
  --f-display:"Zen Kaku Gothic New","Noto Sans JP","Hiragino Sans",sans-serif;
  --f-ja:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --f-ko:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-en:"Noto Sans JP",-apple-system,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1620; --surface:#15212D; --ink:#E6EEF5; --muted:#9AAEBF; --line:#26394A;
  --brand:#3AA6E6; --brand-ink:#06121C; --sky:#82D0F8; --coral:#F07B6B;
  --chip:#1B2C3B; --open:#182837; --band:#0A3A5A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1620; --surface:#15212D; --ink:#E6EEF5; --muted:#9AAEBF; --line:#26394A;
  --brand:#3AA6E6; --brand-ink:#06121C; --sky:#82D0F8; --coral:#F07B6B;
  --chip:#1B2C3B; --open:#182837; --band:#0A3A5A; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ja);font-size:17px;line-height:1.7;-webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent}
body[data-lang="ko"]{font-family:var(--f-ko)}
body[data-lang="en"]{font-family:var(--f-en)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{background:var(--band);color:#fff}
header .wrap{padding-block:28px 24px;display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between}
.brand{min-width:0}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--sky);font-weight:700;font-family:var(--f-en)}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,4.4vw,40px);line-height:1.2;margin:6px 0 4px;text-wrap:balance}
.sub{margin:0;color:#CFE6F5;font-size:15px}
.booth{font-family:var(--f-en);font-size:13px;letter-spacing:.08em;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 14px;white-space:nowrap}

.lang{display:flex;gap:4px;background:rgba(255,255,255,.12);padding:4px;border-radius:12px}
.lang button{appearance:none;border:0;background:transparent;color:#fff;font:inherit;font-size:16px;font-weight:700;
  padding:10px 18px;border-radius:9px;min-height:48px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#fff;color:#0B5E92}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{padding-block:12px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{appearance:none;flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:15px;font-weight:500;
  padding:10px 16px;border-radius:999px;min-height:46px;cursor:pointer;display:flex;align-items:center;gap:8px}
.chip .ct{font-family:var(--f-en);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip[aria-pressed="true"] .ct{color:inherit;opacity:.8}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;min-height:46px}
.search input::placeholder{color:var(--muted)}

main .wrap{padding-block:20px 40px}
.group{margin:0 0 28px}
.group h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 10px;font-family:inherit}
.list{display:flex;flex-direction:column;gap:10px}
.qa{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.qa[open]{background:var(--open);border-color:var(--brand)}
.qa summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;padding:18px 18px;min-height:64px}
.qa summary::-webkit-details-marker{display:none}
.qa summary:focus-visible{outline:3px solid var(--sky);outline-offset:-3px;border-radius:14px}
.num{font-family:var(--f-en);font-weight:700;font-size:14px;color:var(--brand);font-variant-numeric:tabular-nums;padding-top:3px;min-width:2ch}
.q{font-weight:700;font-size:18px;line-height:1.5;min-width:0}
.mark{width:28px;height:28px;border-radius:50%;border:2px solid var(--brand);position:relative;flex:none;margin-top:1px}
.mark::before,.mark::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:2px;background:var(--brand);transform:translate(-50%,-50%)}
.mark::after{transform:translate(-50%,-50%) rotate(90deg);transition:transform .2s}
.qa[open] .mark::after{transform:translate(-50%,-50%) rotate(0deg)}
.ans{padding:0 18px 22px 18px;margin-left:calc(2ch + 14px);min-width:0}
.ans p{margin:0 0 .6em;max-width:68ch}
.qp{font-size:14px;color:var(--muted);font-weight:400;margin-top:4px}
.ap{font-size:14px;color:var(--muted);border-top:1px dashed var(--line);margin-top:12px;padding-top:10px}
.ap b{font-family:var(--f-en);font-size:11px;letter-spacing:.12em;color:var(--coral);display:block;margin-bottom:2px}

.layers{margin:16px 0 4px;display:grid;gap:8px;max-width:620px}
.lay{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border-radius:12px;padding:12px 14px;border:1px solid var(--line);background:var(--surface)}
.lay .t{font-weight:700}
.lay .d{font-size:14px;color:var(--muted)}
.lay .tag{font-family:var(--f-en);font-weight:700;font-size:13px;padding:6px 12px;border-radius:999px;white-space:nowrap}
.lay.net .tag{background:var(--brand);color:var(--brand-ink)}
.lay.end .tag{background:var(--coral);color:#fff}
.lay.ext{background:transparent;border-style:dashed}

.empty{color:var(--muted);text-align:center;padding:40px 0}
footer .wrap{padding-block:8px 32px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}
.staff{display:flex;align-items:center;gap:10px;font-size:13px}
.switch{appearance:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;border:0;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch:checked{background:var(--brand)}
.switch:checked::after{left:21px}
.switch:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
@media (max-width:560px){
  .q{font-size:16px} .ans{margin-left:0} .lang button{padding:10px 12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <div class="wrap">
    <div class="brand">
      <div class="eyebrow">Somansa · Security Days Fall 2026</div>
      <h1 id="title">WebKeeper AI DLP</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:10px">
      <span class="booth">BOOTH B11</span>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-l="ja" aria-pressed="true">日本語</button>
        <button type="button" data-l="en" aria-pressed="false">English</button>
        <button type="button" data-l="ko" aria-pressed="false">한국어</button>
      </div>
    </div>
  </div>
</header>

<div class="bar">
  <div class="wrap">
    <div class="chips" id="chips" role="group" aria-label="Topics"></div>
    <div class="search"><input id="q" type="search" autocomplete="off" enterkeyhint="search"></div>
  </div>
</div>

<main><div class="wrap" id="out"></div></main>

<footer>
  <div class="wrap">
    <span id="foot"></span>
    <label class="staff" for="pron"><input class="switch" type="checkbox" id="pron"> <span>스태프용 · 일본어 한글 발음 보기</span></label>
  </div>
</footer>

<script>
const DATA = [{"n": 1, "c": "detect", "ko": ["개인정보는 무엇으로 판단합니까?", "정규표현식과 체크섬으로 판단합니다. 주민등록번호, 카드번호, 계좌번호처럼 검증 규칙이 있는 정보는 체크섬으로 실제 유효한 번호인지 확인하기 때문에 오탐이 적습니다. 소만사는 30년간 개인정보보호에 집중하며 수천 건의 프로젝트에서 판단 노하우를 쌓았고, 방대한 체크섬 패턴을 보유하고 있습니다."], "ja": ["個人情報は何で判定するのですか？", "正規表現とチェックサムで判定します。カード番号や口座番号、マイナンバーのように検証ルールがある番号は、チェックサムで実在する有効な番号かどうかまで確認するため、誤検知が少なくなります。ソマンサは30年間、個人情報保護に専念し、数千件のプロジェクトを通じて判定のノウハウを蓄積してきました。膨大なチェックサムパターンを保有しています。"], "jp": ["코진죠-호-와 난데 한테-스루노데스카?", "세-키효-겐토 첵쿠사무데 한테-시마스. 카-도방고-야 코-자방고-, 마이남바-노 요-니 켄쇼- 루-루가 아루 방고-와, 첵쿠사무데 짓자이스루 유-코-나 방고-카 도-카마데 카쿠닌스루 타메, 고켄치가 스쿠나쿠 나리마스. 소만사와 산쥬-넨칸, 코진죠-호- 호고니 센넨시, 스-센켄노 프로젝토오 츠-지테 한테-노 노-하우오 치쿠세키시테 키마시타. 보-다이나 첵쿠사무 파탄오 호유-시테 이마스."], "en": ["How do you identify personal information?", "We use regular expressions and checksums. For numbers with validation rules, such as card numbers, bank account numbers, and Japan's My Number, the checksum verifies whether the number is actually valid, which keeps false positives low. Somansa has focused on personal data protection for 30 years, building detection know-how through thousands of projects, and maintains an extensive library of checksum patterns."], "dg": false}, {"n": 2, "c": "detect", "ko": ["기밀정보는 체크섬이 없는데 어떻게 판단합니까?", "고객사가 보유한 내부 문서를 사전에 학습시켜 문서의 유사도와 벡터값을 추출합니다. 이 값을 기준으로 프롬프트나 업로드 파일이 기밀·산업정보와 얼마나 비슷한지 판별합니다. 학습 데이터 자체도 기밀이기 때문에 외부로 나가면 안 되고, 그래서 온프레미스 구축을 권장합니다."], "ja": ["機密情報にはチェックサムがありませんが、どのように判定するのですか？", "お客様が保有する社内文書を事前に学習させ、文書の類似度とベクトル値を抽出します。この値をもとに、プロンプトやアップロードファイルが機密情報・産業情報とどの程度似ているかを判定します。学習データそのものも機密であり、外部に出てはならないため、オンプレミスでの構築を推奨しています。"], "jp": ["키미츠죠-호-니와 첵쿠사무가 아리마센가, 도노 요-니 한테-스루노데스카?", "오캬쿠사마가 호유-스루 샤나이 분쇼오 지젠니 가쿠슈-사세, 분쇼노 루이지도토 베쿠토루치오 츄-슈츠시마스. 코노 아타이오 모토니, 프롬프토야 압푸로-도 화이루가 키미츠죠-호-・산교-죠-호-토 도노 테-도 니테 이루카오 한테-시마스. 가쿠슈- 데-타 소노모노모 키미츠데 아리, 가이부니 데테와 나라나이 타메, 온프레미스데노 코-치쿠오 스이쇼-시테 이마스."], "en": ["Confidential information has no checksum. How do you identify it?", "We train the system in advance on the customer's internal documents and extract document similarity and vector values. Based on these, we determine how closely a prompt or uploaded file resembles confidential or industrial information. Because the training data itself is confidential and must never leave the company, we recommend on-premises deployment."], "dg": false}, {"n": 3, "c": "detect", "ko": ["문서 유사도도 LLM으로 분석합니까?", "문서 학습에는 LLM을 활용합니다. 하지만 벡터값 추출과 유사도 판정은 소만사가 자체 개발한 기술로 합니다. LLM은 문맥과 비정형 데이터를 이해하는 데 강하지만, 모든 분석을 LLM에만 맡기면 두 가지 문제가 생깁니다. 첫째, GPU 자원이 많이 들어 고객의 하드웨어 비용 부담이 커집니다. 둘째, 문맥을 일부러 흐리는 입력이 들어오면 LLM의 판단이 흔들릴 수 있습니다. 그래서 소만사는 데이터 자체를 보는 분석(정규식, 문서 유사도)과 문맥을 보는 분석(LLM)을 함께 사용합니다. 두 가지를 모두 거쳐 판단하기 때문에 더 정확하게 유출을 막을 수 있습니다."], "ja": ["文書の類似度分析もLLMで行うのですか？", "文書の学習にはLLMを活用しますが、ベクトル値の抽出と類似度の判定は自社開発の技術で行います。LLMは文脈や非構造化データの理解に優れていますが、すべての分析をLLMだけに任せると二つの問題が生じます。第一に、GPUリソースを多く消費し、お客様のハードウェアコストが増大します。第二に、意図的に文脈を曖昧にした入力があると、LLMの判断が揺らぐ可能性があります。そのためソマンサは、データそのものを見る分析（正規表現・文書類似度）と、文脈を見る分析（LLM）を組み合わせています。両方の分析を経て判定するため、より正確に情報漏えいを防ぐことができます。"], "jp": ["분쇼노 루이지도 분세키모 에루에루에무데 오코나우노데스카?", "분쇼노 가쿠슈-니와 에루에루에무오 카츠요-시마스가, 베쿠토루치노 츄-슈츠토 루이지도노 한테-와 지샤 카이하츠노 기쥬츠데 오코나이마스. 에루에루에무와 분먀쿠야 히코-조-카 데-타노 리카이니 스구레테 이마스가, 스베테노 분세키오 에루에루에무 다케니 마카세루토 후타츠노 몬다이가 쇼-지마스. 다이이치니, 지-피-유- 리소-스오 오-쿠 쇼-히시, 오캬쿠사마노 하-도웨아 코스토가 조-다이시마스. 다이니니, 이토테키니 분먀쿠오 아이마이니 시타 뉴-료쿠가 아루토, 에루에루에무노 한단가 유라구 카노-세-가 아리마스. 소노 타메 소만사와, 데-타 소노모노오 미루 분세키 (세-키효-겐・분쇼 루이지도) 토, 분먀쿠오 미루 분세키 (에루에루에무) 오 쿠미아와세테 이마스. 료-호-노 분세키오 헤테 한테-스루 타메, 요리 세-카쿠니 죠-호- 로-에-오 후세구 코토가 데키마스."], "en": ["Is document similarity also analyzed with an LLM?", "We use an LLM for document training, but vector extraction and similarity scoring rely on Somansa's own proprietary technology. LLMs are strong at understanding context and unstructured data, but relying on them for every analysis creates two problems. First, it consumes significant GPU resources, raising the customer's hardware costs. Second, inputs that deliberately blur the context can throw off the LLM's judgment. That is why Somansa combines analysis of the data itself (regular expressions and document similarity) with contextual analysis (LLM). Because every decision passes through both, we can prevent leaks more accurately."], "dg": false}, {"n": 4, "c": "detect", "ko": ["키워드 방식 DLP와 무엇이 다릅니까?", "기존 방식은 패턴과 키워드만 보기 때문에 문맥을 이해하지 못합니다. WebKeeper AI DLP는 정규식, 키워드, 임베딩 유사도, LLM 문맥 분석의 4단계로 판단합니다. 그래서 비정형 주소, API 키처럼 패턴이 일정하지 않은 정보도 잡아냅니다."], "ja": ["キーワード方式のDLPと何が違うのですか？", "従来の方式はパターンとキーワードしか見ないため、文脈を理解できません。WebKeeper AI DLPは、正規表現、キーワード、エンベディング類似度、LLMによる文脈分析の4段階で判定します。そのため、非定型の住所やAPIキーのように、パターンが一定でない情報も検知できます。"], "jp": ["키-와-도 호-시키노 디-에루피-토 나니가 치가우노데스카?", "쥬-라이노 호-시키와 파탄토 키-와-도시카 미나이 타메, 분먀쿠오 리카이 데키마센. 웹키-파- 에-아이 디-에루피-와, 세-키효-겐, 키-와-도, 엠베딩구 루이지도, 에루에루에무니 요루 분먀쿠 분세키노 욘단카이데 한테-시마스. 소노 타메, 히테-케-노 쥬-쇼야 에-피-아이 키-노 요-니, 파탄가 잇테-데 나이 죠-호-모 켄치 데키마스."], "en": ["How is this different from keyword-based DLP?", "Conventional methods only look at patterns and keywords, so they cannot understand context. WebKeeper AI DLP makes decisions in four stages: regular expressions, keywords, embedding similarity, and LLM-based contextual analysis. This lets it catch information that has no fixed pattern, such as free-form addresses or API keys."], "dg": false}, {"n": 5, "c": "detect", "ko": ["이미지도 분석합니까?", "네. 도면, 스캔 파일, 지도 같은 이미지를 분석해 실시간으로 차단합니다. 방식은 두 가지입니다. 첫째, 이미지 자체의 유사도로 기밀 도면이나 문서와 비슷한지 판별합니다. 둘째, 이미지 안의 글자를 추출(OCR)해서 내용을 분석합니다. 두 번째 방식은 OCR 전용 서버를 별도로 구성해서 처리합니다. 모든 분석이 고객사 내부(온프레미스)에서 이루어지기 때문에, 도면이나 설계도 같은 민감한 이미지도 외부로 나가지 않고 안전하게 분석할 수 있습니다."], "ja": ["画像も分析できますか？", "はい。図面、スキャンファイル、地図などの画像を分析し、リアルタイムでブロックします。方式は二つあります。第一に、画像そのものの類似度から、機密の図面や文書に似ているかを判定します。第二に、画像内の文字を抽出（OCR）して内容を分析します。二つ目の方式は、OCR専用サーバーを別途構成して処理します。すべての分析がお客様の社内（オンプレミス）で行われるため、図面や設計図のような機密性の高い画像も、外部に出ることなく安全に分析できます。"], "jp": ["가조-모 분세키 데키마스카?", "하이. 즈멘, 스캰 화이루, 치즈 나도노 가조-오 분세키시, 리아루타이무데 브록쿠시마스. 호-시키와 후타츠 아리마스. 다이이치니, 가조- 소노모노노 루이지도카라, 키미츠노 즈멘야 분쇼니 니테 이루카오 한테-시마스. 다이니니, 가조-나이노 모지오 츄-슈츠 (오-시-아-루) 시테 나이요-오 분세키시마스. 후타츠메노 호-시키와, 오-시-아-루 센요- 사-바-오 벳토 코-세-시테 쇼리시마스. 스베테노 분세키가 오캬쿠사마노 샤나이 (온프레미스) 데 오코나와레루 타메, 즈멘야 셋케-즈노 요-나 키미츠세-노 타카이 가조-모, 가이부니 데루 코토나쿠 안젠니 분세키 데키마스."], "en": ["Can it analyze images?", "Yes. It analyzes images such as drawings, scanned files, and maps, and blocks them in real time. There are two methods. First, it uses image similarity to determine whether an image resembles a confidential drawing or document. Second, it extracts text from the image (OCR) and analyzes the content. The second method runs on a dedicated OCR server. Since all analysis takes place inside the customer's environment (on-premises), even sensitive images like drawings and blueprints are analyzed safely without leaving the company."], "dg": false}, {"n": 6, "c": "detect", "ko": ["'의도 분석'이 무엇입니까?", "대화 흐름을 보고 실수로 입력한 것인지, 고의로 유출하려는 것인지를 구분합니다. 불법·범죄 목적의 프롬프트도 따로 분류합니다."], "ja": ["「意図分析」とは何ですか？", "会話の流れを見て、うっかり入力したものか、意図的に持ち出そうとしたものかを区別します。違法・犯罪目的のプロンプトも別途分類します。"], "jp": ["이토 분세키토와 난데스카?", "카이와노 나가레오 미테, 웃카리 뉴-료쿠시타 모노카, 이토테키니 모치다소-토 시타 모노카오 쿠베츠시마스. 이호-・한자이 모쿠테키노 프롬프토모 벳토 분루이시마스."], "en": ["What is \"intent analysis\"?", "It looks at the flow of the conversation to distinguish accidental input from deliberate attempts to take data out. Prompts with illegal or criminal intent are also classified separately."], "dg": false}, {"n": 7, "c": "detect", "ko": ["프롬프트 인젝션이나 유해 프롬프트도 막습니까?", "네. 탐지 결과를 기밀·개인·민감정보, 인젝션, 유해 데이터로 나눠 분류하고 통제합니다."], "ja": ["プロンプトインジェクションや有害なプロンプトも防げますか？", "はい。検知結果を、機密・個人・センシティブ情報、インジェクション、有害データに分類して制御します。"], "jp": ["프롬프토 인제쿠숀야 유-가이나 프롬프토모 후세게마스카?", "하이. 켄치 켁카오, 키미츠・코진・센시티부 죠-호-, 인제쿠숀, 유-가이 데-타니 분루이시테 세-교시마스."], "en": ["Does it also block prompt injection and harmful prompts?", "Yes. Detection results are classified into confidential, personal, and sensitive information, injection, and harmful data, and controlled accordingly."], "dg": false}, {"n": 8, "c": "detect", "ko": ["오탐이 많으면 업무가 막히지 않습니까?", "맞습니다. 그래서 오탐을 줄이는 정교함이 AI DLP의 핵심입니다. 소만사는 4단계 분석으로 정확도를 높이고, 고객 환경에 맞춰 정책을 다르게 설계합니다. 기밀 데이터가 많은 연구소나 설계 부서는 정교하게 차단하고, 다루는 민감 데이터가 적은 부서는 차단 없이 로그만 남깁니다. 또는 승인한 생성형 AI만 허용해서 유출 채널 자체를 줄이는 방법도 있습니다. 한 가지 정책을 전사에 일괄 적용하는 것이 아니라, 부서별 위험도에 맞춰 운영하는 것이 업무를 막지 않는 방법입니다."], "ja": ["誤検知が多いと、業務が止まってしまいませんか？", "おっしゃる通りです。だからこそ、誤検知を減らす精度がAI DLPの要です。ソマンサは4段階の分析で精度を高め、お客様の環境に合わせてポリシーを設計します。機密データの多い研究所や設計部門は厳密にブロックし、扱う機密データが少ない部門はブロックせずにログのみを残します。また、承認した生成AIだけを許可し、漏えいの経路そのものを減らす方法もあります。一つのポリシーを全社一律に適用するのではなく、部門ごとのリスクに合わせて運用することが、業務を止めない方法です。"], "jp": ["고켄치가 오-이토, 교-무가 토맛테 시마이마센카?", "옷샤루 토-리데스. 다카라코소, 고켄치오 헤라스 세-도가 에-아이 디-에루피-노 카나메데스. 소만사와 욘단카이노 분세키데 세-도오 타카메, 오캬쿠사마노 칸쿄-니 아와세테 포리시-오 셋케-시마스. 키미츠 데-타노 오-이 켄큐-쇼야 셋케- 부몬와 겐미츠니 브록쿠시, 아츠카우 키미츠 데-타가 스쿠나이 부몬와 브록쿠세즈니 로구노미오 노코시마스. 마타, 쇼-닌시타 세-세- 에-아이 다케오 쿄카시, 로-에-노 케-로 소노모노오 헤라스 호-호-모 아리마스. 히토츠노 포리시-오 젠샤 이치리츠니 테키요-스루노데와 나쿠, 부몬고토노 리스쿠니 아와세테 운요-스루 코토가, 교-무오 토메나이 호-호-데스."], "en": ["Won't false positives disrupt everyday work?", "You're right, which is exactly why precision in reducing false positives is the core of AI DLP. Somansa raises accuracy through four-stage analysis and designs policies around each customer's environment. R&D labs and design departments with lots of confidential data get strict blocking, while departments handling little sensitive data can be set to log only, without blocking. Another option is to allow only approved generative AI services, reducing the leak channels themselves. Rather than applying one policy across the whole company, operating by each department's risk level is how you keep work moving."], "dg": false}, {"n": 9, "c": "detect", "ko": ["문서 자동분류는 어떻게 됩니까?", "20개 대분류, 100여 개 소분류로 문서 성격을 자동 분류하고, 기밀 수준과 위험도에 따라 3단계 보안 등급을 매깁니다."], "ja": ["文書の自動分類はどのように行われますか？", "20の大分類、約100の小分類で文書の性格を自動分類し、機密レベルとリスクに応じて3段階のセキュリティ等級を付与します。"], "jp": ["분쇼노 지도- 분루이와 도노 요-니 오코나와레마스카?", "니쥬-노 다이분루이, 야쿠 햐쿠노 쇼-분루이데 분쇼노 세-카쿠오 지도- 분루이시, 키미츠 레베루토 리스쿠니 오-지테 산단카이노 세큐리티 토-큐-오 후요시마스."], "en": ["How does automatic document classification work?", "Documents are automatically classified into 20 main categories and about 100 subcategories, then assigned one of three security levels based on confidentiality and risk."], "dg": false}, {"n": 10, "c": "scope", "ko": ["차단 아니면 허용뿐입니까?", "아닙니다. 차단과 허용 외에 마스킹 전송도 지원합니다. 프롬프트에 개인정보나 기밀정보가 포함되어 있으면 그 부분만 가려서 생성형 AI로 보냅니다. 직원은 업무를 계속할 수 있고, 민감한 정보는 밖으로 나가지 않습니다. 현재 한국의 대기업 고객사에서 추가 도입을 위한 POC를 진행하고 있습니다."], "ja": ["ブロックか許可か、の二択だけですか？", "いいえ。ブロックと許可に加えて、マスキング送信にも対応しています。プロンプトに個人情報や機密情報が含まれている場合、その部分だけを伏せて生成AIに送信します。社員は業務を続けられ、機密性の高い情報は外部に出ません。現在、韓国の大手企業のお客様で追加導入に向けたPoCを実施中です。"], "jp": ["브록쿠카 쿄카카, 노 니타쿠 다케데스카?", "이-에. 브록쿠토 쿄카니 쿠와에테, 마스킹구 소-신니모 타이오-시테 이마스. 프롬프토니 코진죠-호-야 키미츠죠-호-가 후쿠마레테 이루 바아이, 소노 부분 다케오 후세테 세-세- 에-아이니 소-신시마스. 샤인와 교-무오 츠즈케라레, 키미츠세-노 타카이 죠-호-와 가이부니 데마센. 겐자이, 칸코쿠노 오-테 키교-노 오캬쿠사마데 츠이카 도-뉴-니 무케타 피-오-시-오 짓시츄-데스."], "en": ["Is it only block or allow?", "No. Beyond block and allow, it also supports masked transmission. If a prompt contains personal or confidential information, only that portion is masked before it is sent to the generative AI. Employees can keep working, and sensitive information never leaves the company. A major Korean enterprise customer is currently running a PoC for an expanded rollout."], "dg": false}, {"n": 11, "c": "scope", "ko": ["생성형 AI 서비스만 통제합니까?", "AI DLP는 생성형 AI 전용 솔루션입니다. Gmail, Facebook, OneDrive, GitHub 같은 일반 웹서비스를 통한 유출까지 막고 싶으시면 기존 네트워크 DLP에 AI DLP 라이선스만 추가하시면 됩니다."], "ja": ["生成AIサービスだけを制御するのですか？", "AI DLPは生成AIに特化したソリューションです。Gmail、Facebook、OneDrive、GitHubなど一般的なWebサービスを経由した漏えいも防ぎたい場合は、ソマンサのネットワークDLPと組み合わせることで対応できます。"], "jp": ["세-세- 에-아이 사-비스 다케오 세-교스루노데스카?", "에-아이 디-에루피-와 세-세- 에-아이니 톡카시타 소류-숀데스. 지-메-루, 훼이스북쿠, 완도라이부, 깃토하부 나도 입판테키나 웨부 사-비스오 케-유시타 로-에-모 후세기타이 바아이와, 소만사노 넷토와-쿠 디-에루피-토 쿠미아와세루 코토데 타이오- 데키마스."], "en": ["Does it only control generative AI services?", "AI DLP is a solution dedicated to generative AI. If you also want to prevent leaks through general web services such as Gmail, Facebook, OneDrive, and GitHub, you can combine it with Somansa's network DLP."], "dg": false}, {"n": 12, "c": "scope", "ko": ["어떤 AI 서비스를 지원합니까?", "ChatGPT, Claude, Gemini, Copilot, Perplexity, DeepSeek, Grok, Cursor, GitHub Copilot, Notion AI 등 60종 이상을 지원하고, 새로운 서비스도 계속 추가하고 있습니다."], "ja": ["どのようなAIサービスに対応していますか？", "ChatGPT、Claude、Gemini、Copilot、Perplexity、DeepSeek、Grok、Cursor、GitHub Copilot、Notion AIなど60種類以上に対応しており、新しいサービスも継続的に追加しています。"], "jp": ["도노 요-나 에-아이 사-비스니 타이오-시테 이마스카?", "챳토지-피-티-, 쿠로-도, 제미니, 코파이롯토, 파-푸레키시티, 디-푸시-쿠, 구록쿠, 카-소루, 깃토하부 코파이롯토, 노-숀 에-아이 나도 로쿠쥬-슈루이 이죠-니 타이오-시테 오리, 아타라시이 사-비스모 케-조쿠테키니 츠이카시테 이마스."], "en": ["Which AI services are supported?", "We support more than 60 services, including ChatGPT, Claude, Gemini, Copilot, Perplexity, DeepSeek, Grok, Cursor, GitHub Copilot, and Notion AI, and we keep adding new ones."], "dg": false}, {"n": 13, "c": "scope", "ko": ["특정 AI만 허용할 수 있습니까?", "네. 부서별, 서비스별, 시간대별로 정책을 세분화할 수 있습니다. 예를 들어 승인한 AI만 허용하고 나머지는 모두 차단할 수 있습니다."], "ja": ["特定のAIだけを許可することはできますか？", "はい。部門別、サービス別、時間帯別にポリシーを細かく設定できます。たとえば、承認したAIだけを許可し、それ以外はすべてブロックすることも可能です。"], "jp": ["토쿠테-노 에-아이 다케오 쿄카스루 코토와 데키마스카?", "하이. 부몬베츠, 사-비스베츠, 지칸타이베츠니 포리시-오 코마카쿠 셋테- 데키마스. 타토에바, 쇼-닌시타 에-아이 다케오 쿄카시, 소레 이가이와 스베테 브록쿠스루 코토모 카노-데스."], "en": ["Can we allow only specific AI services?", "Yes. Policies can be set in detail by department, service, and time of day. For example, you can allow only approved AI services and block everything else."], "dg": false}, {"n": 14, "c": "scope", "ko": ["회사가 모르는 AI 사용(섀도우 AI)도 파악됩니까?", "네. 접속 내역이 모두 기록되므로 임직원이 어떤 생성형 AI를 쓰고 있는지 확인할 수 있습니다."], "ja": ["会社が把握していないAI利用（シャドーAI）も把握できますか？", "はい。すべてのアクセス履歴が記録されるため、社員がどの生成AIを使っているかを確認できます。"], "jp": ["카이샤가 하아쿠시테 이나이 에-아이 리요- (샤도- 에-아이) 모 하아쿠 데키마스카?", "하이. 스베테노 아쿠세스 리레키가 키로쿠사레루 타메, 샤인가 도노 세-세- 에-아이오 츠캇테 이루카오 카쿠닌 데키마스."], "en": ["Can it detect AI use the company doesn't know about (shadow AI)?", "Yes. All access history is recorded, so you can see which generative AI services employees are using."], "dg": false}, {"n": 15, "c": "scope", "ko": ["브라우저가 아닌 데스크톱 앱(ChatGPT 앱 등)이나 API 호출도 잡습니까?", "네. 브라우저뿐 아니라 데스크톱 AI 앱, Claude Code 같은 AI 코딩 도구, MCP로 연동된 서비스까지 네트워크를 거치는 채널은 모두 탐지 대상입니다."], "ja": ["ブラウザ以外のデスクトップアプリ（ChatGPTアプリなど）やAPI呼び出しも検知できますか？", "はい。ブラウザだけでなく、デスクトップAIアプリ、Claude CodeのようなAIコーディングツール、MCPで連携したサービスまで、ネットワークを経由するチャネルはすべて検知対象です。"], "jp": ["브라우자 이가이노 데스쿠톱푸 아푸리 (챳토지-피-티- 아푸리 나도) 야 에-피-아이 요비다시모 켄치 데키마스카?", "하이. 브라우자 다케데 나쿠, 데스쿠톱푸 에-아이 아푸리, 쿠로-도 코-도노 요-나 에-아이 코-딩구 츠-루, 에무시-피-데 렌케-시타 사-비스마데, 넷토와-쿠오 케-유스루 챠네루와 스베테 켄치 타이쇼-데스."], "en": ["Does it catch desktop apps (like the ChatGPT app) and API calls, not just browsers?", "Yes. Beyond browsers, every channel that passes through the network is covered, including desktop AI apps, AI coding tools like Claude Code, and services connected via MCP."], "dg": false}, {"n": 16, "c": "scope", "ko": ["AI의 응답(출력값)도 검사합니까?", "프롬프트와 응답은 모두 감사 로그로 저장합니다. 응답 내용까지 통제해야 하는 환경, 특히 사내에서 자체 LLM이나 AI 에이전트를 운영하는 환경은 엔드포인트 단의 AIDR이 담당합니다. AIDR은 AI DLP와 별도의 제품이며, 이번 전시에서는 AI DLP를 중심으로 소개드리고 있습니다. 관심 있으시면 자료를 따로 보내드리겠습니다."], "ja": ["AIの応答（出力）も検査しますか？", "プロンプトと応答はすべて監査ログとして保存します。応答の内容まで制御する必要がある環境、特に社内で独自のLLMやAIエージェントを運用している環境は、エンドポイント側のAIDRが担います。AIDRはAI DLPとは別の製品で、今回の展示ではAI DLPを中心にご紹介しています。ご関心があれば、資料を別途お送りいたします。"], "jp": ["에-아이노 오-토- (슈츠료쿠) 모 켄사시마스카?", "프롬프토토 오-토-와 스베테 칸사 로구토 시테 호존시마스. 오-토-노 나이요-마데 세-교스루 히츠요-가 아루 칸쿄-, 토쿠니 샤나이데 도쿠지노 에루에루에무야 에-아이 에-젠토오 운요-시테 이루 칸쿄-와, 엔도포인토가와노 에-아이디-아-루가 니나이마스. 에-아이디-아-루와 에-아이 디-에루피-토와 베츠노 세-힌데, 콘카이노 텐지데와 에-아이 디-에루피-오 츄-신니 고쇼-카이시테 이마스. 고칸신가 아레바, 시료-오 벳토 오오쿠리 이타시마스."], "en": ["Does it also inspect AI responses (output)?", "Both prompts and responses are stored as audit logs. Environments that need to control the content of responses, especially those running in-house LLMs or AI agents, are covered by AIDR at the endpoint level. AIDR is a separate product from AI DLP, and at this exhibition we are focusing on AI DLP. If you're interested, we'd be happy to send you materials separately."], "dg": false}, {"n": 17, "c": "scope", "ko": ["사내에서 자체 LLM을 운영하는데, AI DLP로 통제됩니까?", "AI DLP는 사내 네트워크에서 외부로 나가는 길목을 지킵니다. 그런데 사내에 자체 LLM을 운영하면 직원 PC와 사내 LLM 서버 사이, 또는 PC 안의 AI 에이전트와 로컬 파일 사이에서만 데이터가 오갑니다. 외부로 나가는 길목을 지나지 않기 때문에 네트워크 제품인 AI DLP로는 볼 수 없는 구간입니다. 이 구간은 엔드포인트, 즉 직원 PC 단에서 동작하는 AIDR이 담당합니다. 정리하면, 외부 생성형 AI로 나가는 데이터는 네트워크 계층의 AI DLP가, 사내 LLM과 AI 에이전트 사이에서 오가는 데이터는 엔드포인트 계층의 AIDR이 지키는 계층 구조입니다. AIDR은 EDR 계열의 별도 제품입니다."], "ja": ["社内で独自のLLMを運用していますが、AI DLPで制御できますか？", "AI DLPは、社内ネットワークから外部へ出る出口を守る製品です。しかし社内で独自のLLMを運用すると、データは社員のPCと社内LLMサーバーの間、またはPC内のAIエージェントとローカルファイルの間だけでやり取りされます。外部への出口を通らないため、ネットワーク製品であるAI DLPでは見えない区間です。この区間は、エンドポイント、つまり社員のPC側で動作するAIDRが担当します。まとめると、外部の生成AIへ出ていくデータはネットワーク層のAI DLPが、社内LLMやAIエージェントとの間でやり取りされるデータはエンドポイント層のAIDRが守る、という階層構造です。AIDRはEDR系の別製品です。"], "jp": ["샤나이데 도쿠지노 에루에루에무오 운요-시테 이마스가, 에-아이 디-에루피-데 세-교 데키마스카?", "에-아이 디-에루피-와, 샤나이 넷토와-쿠카라 가이부에 데루 데구치오 마모루 세-힌데스. 시카시 샤나이데 도쿠지노 에루에루에무오 운요-스루토, 데-타와 샤인노 피-시-토 샤나이 에루에루에무 사-바-노 아이다, 마타와 피-시-나이노 에-아이 에-젠토토 로-카루 화이루노 아이다 다케데 야리토리 사레마스. 가이부에노 데구치오 토-라나이 타메, 넷토와-쿠 세-힌데 아루 에-아이 디-에루피-데와 미에나이 쿠칸데스. 코노 쿠칸와, 엔도포인토, 츠마리 샤인노 피-시-가와데 도-사스루 에-아이디-아-루가 탄토-시마스. 마토메루토, 가이부노 세-세- 에-아이에 데테 이쿠 데-타와 넷토와-쿠소-노 에-아이 디-에루피-가, 샤나이 에루에루에무야 에-아이 에-젠토토노 아이다데 야리토리 사레루 데-타와 엔도포인토소-노 에-아이디-아-루가 마모루, 토 이우 카이소- 코-조-데스. 에-아이디-아-루와 이-디-아-루케-노 베츠 세-힌데스."], "en": ["We run our own in-house LLM. Can AI DLP control it?", "AI DLP guards the exit point where data leaves the corporate network. When you run your own LLM in-house, data only moves between employee PCs and the internal LLM server, or between an AI agent and local files on the PC. Because it never passes the exit point, that segment is out of view for a network product like AI DLP. That segment is covered by AIDR, which runs at the endpoint, on the employee's PC. In short, it is a layered structure: AI DLP at the network layer protects data going out to external generative AI, and AIDR at the endpoint layer protects data moving between in-house LLMs and AI agents. AIDR is a separate, EDR-type product."], "dg": true}, {"n": 18, "c": "deploy", "ko": ["온프레미스로만 제공합니까?", "온프레미스가 기본이며, 권장하는 방식입니다. 내부 문서 학습(문서 유사도 분석)을 사용하지 않는 구성이라면 클라우드로도 제공할 수 있습니다. 다만 기밀정보를 정밀하게 탐지하려면 고객사의 내부 문서를 학습해야 하고, 그 학습 데이터 자체가 가장 중요한 기밀입니다. 그래서 실제로는 내부 데이터 학습이 필요하다는 점을 확인하신 고객사 대부분이 온프레미스를 선택하십니다."], "ja": ["オンプレミスでのみ提供していますか？", "オンプレミスが基本で、推奨している方式です。社内文書の学習（文書類似度分析）を使用しない構成であれば、クラウドでも提供できます。ただし、機密情報を精密に検知するにはお客様の社内文書を学習する必要があり、その学習データそのものが最も重要な機密です。そのため実際には、社内データの学習が必要だと確認されたお客様のほとんどがオンプレミスを選ばれています。"], "jp": ["온프레미스데노미 테-쿄-시테 이마스카?", "온프레미스가 키혼데, 스이쇼-시테 이루 호-시키데스. 샤나이 분쇼노 가쿠슈- (분쇼 루이지도 분세키) 오 시요-시나이 코-세-데 아레바, 쿠라우도데모 테-쿄- 데키마스. 타다시, 키미츠죠-호-오 세-미츠니 켄치스루니와 오캬쿠사마노 샤나이 분쇼오 가쿠슈-스루 히츠요-가 아리, 소노 가쿠슈- 데-타 소노모노가 못토모 쥬-요-나 키미츠데스. 소노 타메 짓사이니와, 샤나이 데-타노 가쿠슈-가 히츠요-다토 카쿠닌사레타 오캬쿠사마노 호톤도가 온프레미스오 에라바레테 이마스."], "en": ["Is it offered on-premises only?", "On-premises is the default and our recommended approach. If the configuration does not use internal document training (document similarity analysis), it can also be provided in the cloud. However, precise detection of confidential information requires training on the customer's internal documents, and that training data is itself the most important secret. So in practice, almost every customer who confirms they need internal data training chooses on-premises."], "dg": false}, {"n": 19, "c": "deploy", "ko": ["탐지에 쓰는 LLM은 외부 API입니까, 내부 모델입니까?", "내부 모델입니다. 오픈소스 LLM을 고객사 내부 서버에서 직접 구동하는 방식(Ollama 기반)을 사용하고 있습니다. 외부 AI 서비스의 API를 호출하지 않기 때문에, 분석 대상 데이터와 학습 데이터가 회사 밖으로 나가지 않습니다."], "ja": ["検知に使うLLMは外部APIですか、それとも社内モデルですか？", "社内モデルです。オープンソースのLLMをお客様の社内サーバーで直接稼働させる方式（Ollamaベース）を採用しています。外部AIサービスのAPIを呼び出さないため、分析対象のデータも学習データも社外に出ることはありません。"], "jp": ["켄치니 츠카우 에루에루에무와 가이부 에-피-아이데스카, 소레토모 샤나이 모데루데스카?", "샤나이 모데루데스. 오-푼소-스노 에루에루에무오 오캬쿠사마노 샤나이 사-바-데 쵸쿠세츠 카도-사세루 호-시키 (오라마 베-스) 오 사이요-시테 이마스. 가이부 에-아이 사-비스노 에-피-아이오 요비다사나이 타메, 분세키 타이쇼-노 데-타모 가쿠슈- 데-타모 샤가이니 데루 코토와 아리마센."], "en": ["Is the detection LLM an external API or an internal model?", "It's an internal model. We run an open-source LLM directly on the customer's own servers (based on Ollama). Since no external AI service APIs are called, neither the analyzed data nor the training data ever leaves the company."], "dg": false}, {"n": 20, "c": "deploy", "ko": ["GPU 같은 하드웨어 요건이 있습니까?", "LLM 분석에는 GPU가 필요합니다. 다만 처음부터 전사에 적용하실 필요는 없습니다. 연구개발, 설계, 개인정보 취급 부서처럼 보안 등급이 높은 부서부터 우선 적용하고, 효과를 확인하신 뒤 단계적으로 확대하시는 방식을 권장합니다. 초기 투자 부담을 줄이면서 가장 중요한 데이터부터 보호할 수 있습니다."], "ja": ["GPUなどのハードウェア要件はありますか？", "LLM分析にはGPUが必要です。ただし、最初から全社に適用する必要はありません。研究開発、設計、個人情報を扱う部門など、セキュリティレベルの高い部門から優先的に適用し、効果を確認したうえで段階的に拡大する方式をおすすめしています。初期投資を抑えながら、最も重要なデータから保護できます。"], "jp": ["지-피-유- 나도노 하-도웨아 요-켄와 아리마스카?", "에루에루에무 분세키니와 지-피-유-가 히츠요-데스. 타다시, 사이쇼카라 젠샤니 테키요-스루 히츠요-와 아리마센. 켄큐-카이하츠, 셋케-, 코진죠-호-오 아츠카우 부몬 나도, 세큐리티 레베루노 타카이 부몬카라 유-센테키니 테키요-시, 코-카오 카쿠닌시타 우에데 단카이테키니 카쿠다이스루 호-시키오 오스스메시테 이마스. 쇼키 토-시오 오사에나가라, 못토모 쥬-요-나 데-타카라 호고 데키마스."], "en": ["Are there hardware requirements such as GPUs?", "GPUs are required for LLM analysis. However, you don't need to roll it out company-wide from day one. We recommend starting with high-security departments such as R&D, design, and teams handling personal data, then expanding step by step once you've confirmed the results. This keeps initial investment down while protecting your most important data first."], "dg": false}, {"n": 21, "c": "deploy", "ko": ["에이전트를 설치해야 하는 제품입니까?", "아닙니다. 네트워크 기반 제품입니다. 사내망에서 외부로 나가는 길목에 설치되어, 데이터가 밖으로 나가기 전에 탐지, 분석, 차단하고 로그를 남깁니다. 사용자 PC에는 에이전트를 설치하지 않습니다. 그래서 PC마다 설치 여부나 업데이트 상태를 일일이 확인할 필요가 없고, 운영 부담이 적습니다. 프록시 설정과 인증서는 중앙에서 일괄 배포합니다."], "ja": ["エージェントのインストールが必要な製品ですか？", "いいえ、ネットワーク型の製品です。社内ネットワークから外部へ出る出口に設置し、データが外に出る前に検知・分析・ブロックし、ログを残します。社員のPCにはエージェントをインストールしません。そのため、PCごとにインストール状況やアップデート状況を確認する必要がなく、運用負荷が少なくて済みます。プロキシ設定と証明書は管理側から一括配布します。"], "jp": ["에-젠토노 인스토-루가 히츠요-나 세-힌데스카?", "이-에, 넷토와-쿠가타노 세-힌데스. 샤나이 넷토와-쿠카라 가이부에 데루 데구치니 셋치시, 데-타가 소토니 데루 마에니 켄치・분세키・브록쿠시, 로구오 노코시마스. 샤인노 피-시-니와 에-젠토오 인스토-루 시마센. 소노 타메, 피-시-고토니 인스토-루 죠-쿄-야 압푸데-토 죠-쿄-오 카쿠닌스루 히츠요-가 나쿠, 운요- 후카가 스쿠나쿠테 스미마스. 프록시 셋테-토 쇼-메-쇼와 칸리가와카라 익카츠 하이후시마스."], "en": ["Does it require installing an agent?", "No, it's a network-based product. It sits at the exit point from the corporate network and detects, analyzes, blocks, and logs data before it leaves. No agent is installed on employee PCs, so there is no need to check installation or update status on each machine, which keeps the operational burden low. Proxy settings and certificates are distributed centrally."], "dg": false}, {"n": 22, "c": "deploy", "ko": ["생성형 AI는 대부분 HTTPS인데, 에이전트 없이 내용을 어떻게 봅니까?", "프록시 방식으로 분석합니다. 사용자 PC에 소만사 인증서를 배포하면, 소만사 자체 어플라이언스가 암호화 트래픽의 복호화와 DLP 분석을 한 장비에서 동시에 처리합니다. 인증서는 Active Directory 그룹 정책 등으로 중앙에서 일괄 배포하므로 PC마다 따로 작업할 필요가 없고, 복호화 장비와 DLP 장비를 따로 둘 필요도 없어 구성이 단순합니다."], "ja": ["生成AIはほとんどがHTTPS通信ですが、エージェントなしでどうやって中身を見るのですか？", "プロキシ方式で分析します。社員のPCにソマンサの証明書を配布すると、ソマンサ独自のアプライアンスが、暗号化通信の復号とDLP分析を1台で同時に処理します。証明書はActive Directoryのグループポリシーなどで一括配布するため、PCごとの作業は不要です。復号装置とDLP装置を別々に用意する必要もなく、構成がシンプルです。"], "jp": ["세-세- 에-아이와 호톤도가 에이치티-티-피-에스 츠-신데스가, 에-젠토 나시데 도-얏테 나카미오 미루노데스카?", "프록시 호-시키데 분세키시마스. 샤인노 피-시-니 소만사노 쇼-메-쇼오 하이후스루토, 소만사 도쿠지노 아푸라이안스가, 안고-카 츠-신노 후쿠고-토 디-에루피- 분세키오 이치다이데 도-지니 쇼리시마스. 쇼-메-쇼와 아쿠티부 디레쿠토리노 구루-푸 포리시- 나도데 익카츠 하이후스루 타메, 피-시-고토노 사교-와 후요-데스. 후쿠고- 소-치토 디-에루피- 소-치오 베츠베츠니 요-이스루 히츠요-모 나쿠, 코-세-가 신푸루데스."], "en": ["Most generative AI traffic is HTTPS. How do you see the content without an agent?", "We analyze it with a proxy. Once a Somansa certificate is deployed to employee PCs, Somansa's own appliance decrypts the encrypted traffic and runs DLP analysis simultaneously on a single box. Certificates are distributed centrally, for example through Active Directory Group Policy, so no per-PC work is needed. There's also no need for separate decryption and DLP appliances, which keeps the architecture simple."], "dg": false}, {"n": 23, "c": "deploy", "ko": ["재택근무자나 외부에서 접속하는 노트북도 통제됩니까?", "AI DLP는 네트워크 제품이라 사내망 밖에서 일하는 재택근무자는 범위가 다릅니다. 이 경우는 엔드포인트 DLP, 가상화 PC, ZTNA로 대응하는 것이 맞는 구성입니다. 소만사는 엔드포인트 DLP(Privacy-i)와 가상화(Secure VD-i)도 함께 제공하기 때문에, 사내와 재택 환경을 모두 아우르는 구성을 제안드릴 수 있습니다."], "ja": ["在宅勤務者や社外から接続するノートPCも制御できますか？", "AI DLPはネットワーク製品のため、社内ネットワークの外で働く在宅勤務者は対象範囲が異なります。この場合は、エンドポイントDLP、仮想PC、ZTNAで対応するのが適切な構成です。ソマンサはエンドポイントDLP（Privacy-i）と仮想化（Secure VD-i）も提供しているため、社内と在宅の両方をカバーする構成をご提案できます。"], "jp": ["자이타쿠킨무샤야 샤가이카라 세츠조쿠스루 노-토 피-시-모 세-교 데키마스카?", "에-아이 디-에루피-와 넷토와-쿠 세-힌노 타메, 샤나이 넷토와-쿠노 소토데 하타라쿠 자이타쿠킨무샤와 타이쇼- 한이가 코토나리마스. 코노 바아이와, 엔도포인토 디-에루피-, 카소- 피-시-, 젯토티-엔에-데 타이오-스루노가 테키세츠나 코-세-데스. 소만사와 엔도포인토 디-에루피- (푸라이바시- 아이) 토 카소-카 (세큐아 브이디-아이) 모 테-쿄-시테 이루 타메, 샤나이토 자이타쿠노 료-호-오 카바-스루 코-세-오 고테-안 데키마스."], "en": ["Can it control remote workers and laptops connecting from outside?", "Because AI DLP is a network product, remote workers outside the corporate network fall under a different scope. For them, the right setup is endpoint DLP, virtual PCs, or ZTNA. Somansa also offers endpoint DLP (Privacy-i) and virtualization (Secure VD-i), so we can propose a configuration that covers both the office and remote work."], "dg": false}, {"n": 24, "c": "deploy", "ko": ["인라인 프록시입니까?", "명시적 프록시(Explicit Proxy) 방식으로 구성합니다. 인라인 방식은 모든 트래픽이 반드시 장비를 지나기 때문에 보안성이 높을 수 있지만, 두 가지 단점이 있습니다. 첫째, 트래픽이 많은 환경에서는 지연이 생길 수 있습니다. 둘째, 장비 한 곳에 장애가 나면 전체 네트워크가 멈출 수 있습니다(SPOF). 그래서 인라인은 소규모 환경에 적합하고, 대규모 환경에서는 명시적 프록시가 일반적입니다. 글로벌 보안 기업들의 웹 게이트웨이 제품도 명시적 프록시를 표준 구성으로 많이 사용합니다."], "ja": ["インラインプロキシですか？", "明示的プロキシ（Explicit Proxy）方式で構成します。インライン方式はすべての通信が必ず装置を通過するためセキュリティ面では優れていますが、二つの課題があります。第一に、通信量の多い環境では遅延が発生する可能性があります。第二に、装置の1か所で障害が起きるとネットワーク全体が止まる可能性があります（単一障害点、SPOF）。そのため、インラインは小規模環境に適しており、大規模環境では明示的プロキシが一般的です。グローバルなセキュリティ企業のWebゲートウェイ製品でも、明示的プロキシが標準構成として広く採用されています。"], "jp": ["인라인 프록시데스카?", "메-지테키 프록시 (에쿠스푸리싯토 프록시) 호-시키데 코-세-시마스. 인라인 호-시키와 스베테노 츠-신가 카나라즈 소-치오 츠-카스루 타메 세큐리티멘데와 스구레테 이마스가, 후타츠노 카다이가 아리마스. 다이이치니, 츠-신료-노 오-이 칸쿄-데와 치엔가 학세-스루 카노-세-가 아리마스. 다이니니, 소-치노 익카쇼데 쇼-가이가 오키루토 넷토와-쿠 젠타이가 토마루 카노-세-가 아리마스 (탄이츠 쇼-가이텐, 에스피-오-에후). 소노 타메, 인라인와 쇼-키보 칸쿄-니 테키시테 오리, 다이키보 칸쿄-데와 메-지테키 프록시가 입판테키데스. 구로-바루나 세큐리티 키교-노 웨부 게-토웨이 세-힌데모, 메-지테키 프록시가 효-쥰 코-세-토 시테 히로쿠 사이요-사레테 이마스."], "en": ["Is it an inline proxy?", "We configure it as an explicit proxy. Inline deployment can offer stronger security because all traffic must pass through the appliance, but it has two drawbacks. First, latency can occur in high-traffic environments. Second, a failure at that single appliance can bring down the entire network (a single point of failure, or SPOF). That's why inline suits small environments, while explicit proxy is standard in large ones. Web gateway products from global security vendors also widely use explicit proxy as their standard configuration."], "dg": false}, {"n": 25, "c": "deploy", "ko": ["프록시 서버에 장애가 나면 어떻게 됩니까?", "자동으로 바이패스되어 업무용 인터넷은 끊기지 않습니다."], "ja": ["プロキシサーバーに障害が発生したらどうなりますか？", "自動的にバイパスされるため、業務用のインターネットが途切れることはありません。"], "jp": ["프록시 사-바-니 쇼-가이가 학세-시타라 도- 나리마스카?", "지도-테키니 바이파스 사레루 타메, 교-무요-노 인타-넷토가 토기레루 코토와 아리마센."], "en": ["What happens if the proxy server fails?", "Traffic is automatically bypassed, so business internet access is never interrupted."], "dg": false}, {"n": 26, "c": "deploy", "ko": ["바이패스되는 동안 유출될 수 있지 않습니까?", "가능성은 있습니다. 하지만 DLP의 본질은 차단이 아니라 감사 로그 확보입니다. 차단은 1차 방어이고, 진짜 목적은 무슨 일이 있었는지 빠짐없이 기록하는 것입니다. 유출이 발생해도 로그가 있으면 누가, 언제, 무엇을 보냈는지 추적해 책임 소재를 밝힐 수 있습니다. 그리고 모든 것이 기록된다는 사실 자체가 임직원의 고의 유출을 막는 강력한 억지력이 됩니다. 그래서 바이패스 중에도 별도의 로그 수집 장비가 외부로 나가는 내용을 모두 기록합니다. 장애가 복구되면 그 로그를 분석, 분류해서 관리자가 쉽게 확인할 수 있게 정리합니다."], "ja": ["バイパス中に情報が漏えいする可能性はありませんか？", "可能性はあります。しかし、DLPの本質はブロックではなく、監査ログの確保にあります。ブロックは第一の防御であり、本当の目的は、何が起きたのかを漏れなく記録することです。漏えいが発生しても、ログがあれば、誰が、いつ、何を送信したのかを追跡し、責任の所在を明らかにできます。そして、すべてが記録されているという事実そのものが、社員による意図的な持ち出しを防ぐ強い抑止力になります。そのため、バイパス中も別途のログ収集装置が、外部に送信される内容をすべて記録します。障害が復旧すると、そのログを分析・分類し、管理者が確認しやすい形に整理します。"], "jp": ["바이파스츄-니 죠-호-가 로-에-스루 카노-세-와 아리마센카?", "카노-세-와 아리마스. 시카시, 디-에루피-노 혼시츠와 브록쿠데와 나쿠, 칸사 로구노 카쿠호니 아리마스. 브록쿠와 다이이치노 보-교데 아리, 혼토-노 모쿠테키와, 나니가 오키타노카오 모레나쿠 키로쿠스루 코토데스. 로-에-가 학세-시테모, 로구가 아레바, 다레가, 이츠, 나니오 소-신시타노카오 츠이세키시, 세키닌노 쇼자이오 아키라카니 데키마스. 소시테, 스베테가 키로쿠사레테 이루토 이우 지지츠 소노모노가, 샤인니 요루 이토테키나 모치다시오 후세구 츠요이 요쿠시료쿠니 나리마스. 소노 타메, 바이파스츄-모 벳토노 로구 슈-슈- 소-치가, 가이부니 소-신사레루 나이요-오 스베테 키로쿠시마스. 쇼-가이가 훅큐-스루토, 소노 로구오 분세키・분루이시, 칸리샤가 카쿠닌시야스이 카타치니 세-리시마스."], "en": ["Couldn't data leak during the bypass?", "It's possible. But the essence of DLP is not blocking; it's securing audit logs. Blocking is the first line of defense, and the real goal is to record everything that happened, without gaps. Even if a leak occurs, the logs let you trace who sent what and when, and establish accountability. And the very fact that everything is recorded becomes a strong deterrent against intentional leaks by employees. That's why, even during a bypass, a separate log collection device records everything sent outside. Once the failure is resolved, those logs are analyzed, classified, and organized so administrators can review them easily."], "dg": false}, {"n": 27, "c": "deploy", "ko": ["응답 지연 때문에 사용자가 느려졌다고 느끼지 않습니까?", "자체 테스트에서 20Gbps 트래픽까지 처리하며, 사용자가 체감할 만한 지연은 없었습니다."], "ja": ["応答の遅延で、利用者が遅くなったと感じることはありませんか？", "自社テストでは20Gbpsのトラフィックまで処理でき、利用者が体感するような遅延はありませんでした。"], "jp": ["오-토-노 치엔데, 리요-샤가 오소쿠 낫타토 칸지루 코토와 아리마센카?", "지샤 테스토데와 니쥬- 기가비-피-에스노 토라픽쿠마데 쇼리 데키, 리요-샤가 타이칸스루 요-나 치엔와 아리마센데시타."], "en": ["Will users feel things slow down due to latency?", "In our own testing, it handled up to 20Gbps of traffic with no latency noticeable to users."], "dg": false}, {"n": 28, "c": "audit", "ko": ["로그에는 무엇이 남습니까?", "이용자, 이용일시, 입력 내용과 AI 답변 전체, 전송 파일 원본이 저장됩니다. 대화는 메신저 형태로 재현되기 때문에 보안 전문가가 아니어도 감사 자료를 쉽게 확인할 수 있습니다."], "ja": ["ログには何が残りますか？", "利用者、利用日時、入力内容とAIの回答全文、送信ファイルの原本が保存されます。会話はメッセンジャー形式で再現されるため、セキュリティの専門家でなくても監査資料を簡単に確認できます。"], "jp": ["로구니와 나니가 노코리마스카?", "리요-샤, 리요- 니치지, 뉴-료쿠 나이요-토 에-아이노 카이토- 젠분, 소-신 화이루노 겐퐁가 호존사레마스. 카이와와 멧센쟈- 케-시키데 사이겐사레루 타메, 세큐리티노 센몬카데 나쿠테모 칸사 시료-오 칸탄니 카쿠닌 데키마스."], "en": ["What is recorded in the logs?", "The user, date and time, the full input and AI response, and the original transmitted files are all stored. Conversations are replayed in a messenger-style view, so even non-security staff can easily review audit records."], "dg": false}, {"n": 29, "c": "audit", "ko": ["차단 내역 자체가 2차 유출되지는 않습니까?", "차단 내역은 마스킹 처리되어 2차 유출을 막습니다."], "ja": ["ブロック履歴そのものが二次漏えいすることはありませんか？", "ブロック履歴はマスキング処理されるため、二次漏えいを防ぎます。"], "jp": ["브록쿠 리레키 소노모노가 니지 로-에-스루 코토와 아리마센카?", "브록쿠 리레키와 마스킹구 쇼리 사레루 타메, 니지 로-에-오 후세기마스."], "en": ["Could the block records themselves become a secondary leak?", "Block records are masked, preventing any secondary leak."], "dg": false}, {"n": 30, "c": "company", "ko": ["소만사는 일본에 지사도 없고 도입 이력도 없는데, 어떻게 믿고 사용합니까?", "맞습니다. 일본은 이번이 첫걸음입니다. 일본 기업은 거래처를 정할 때 오래 함께할 수 있는지, 신뢰할 수 있는지를 신중하게 보신다고 알고 있고, 저희도 그 점을 가장 중요하게 생각합니다. 소만사는 한국에서 30년간 개인정보와 기밀정보 보호에만 집중해 온 회사입니다. 5명으로 시작해 지금은 400명이 넘는 회사가 되었습니다. 제품 라인업은 10가지인데, 모두 데이터 보호라는 한 가지 목적을 위한 제품입니다. 한 우물만 판 회사입니다. LG, SK, 롯데 등 한국의 대표 기업들이 소만사 제품을 사용하고 있습니다. 한국 대기업들도 오래 함께할 거래처를 찾고, 그래서 소만사를 선택했습니다. 일본에서도 같은 방식으로 오랫동안 신뢰를 쌓아가겠습니다."], "ja": ["ソマンサは日本に支社も導入実績もありませんが、どうやって信頼すればよいのですか？", "おっしゃる通りです。日本は今回が第一歩です。日本の企業は取引先を選ぶ際、長くお付き合いできるか、信頼できるかを慎重に見極められると伺っており、私どももその点を最も大切に考えています。ソマンサは韓国で30年間、個人情報と機密情報の保護だけに専念してきた会社です。5名で創業し、現在は400名を超える会社になりました。製品ラインナップは10種類ありますが、すべてデータ保護という一つの目的のための製品です。一つの分野をひたすら追求してきた会社です。LG、SK、ロッテなど、韓国を代表する企業がソマンサの製品を使用しています。韓国の大企業も長くお付き合いできる取引先を求め、ソマンサを選んでくださいました。日本でも同じように、長い時間をかけて信頼を築いてまいります。"], "jp": ["소만사와 니혼니 시샤모 도-뉴- 짓세키모 아리마센가, 도-얏테 신라이스레바 요이노데스카?", "옷샤루 토-리데스. 니혼와 콘카이가 다이입포데스. 니혼노 키교-와 토리히키사키오 에라부 사이, 나가쿠 오츠키아이 데키루카, 신라이 데키루카오 신쵸-니 미키와메라레루토 우카갓테 오리, 와타쿠시도모모 소노 텐오 못토모 다이세츠니 캉가에테 이마스. 소만사와 칸코쿠데 산쥬-넨칸, 코진죠-호-토 키미츠죠-호-노 호고 다케니 센넨시테 키타 카이샤데스. 고메-데 소-교-시, 겐자이와 욘햐쿠메-오 코에루 카이샤니 나리마시타. 세-힌 라인납푸와 쥬-슈루이 아리마스가, 스베테 데-타 호고토 이우 히토츠노 모쿠테키노 타메노 세-힌데스. 히토츠노 분야오 히타스라 츠이큐-시테 키타 카이샤데스. 에루지-, 에스케-, 롯테 나도, 칸코쿠오 다이효-스루 키교-가 소만사노 세-힌오 시요-시테 이마스. 칸코쿠노 다이키교-모 나가쿠 오츠키아이 데키루 토리히키사키오 모토메, 소만사오 에란데 쿠다사이마시타. 니혼데모 오나지 요-니, 나가이 지칸오 카케테 신라이오 키즈이테 마이리마스."], "en": ["Somansa has no office and no customers in Japan. Why should we trust you?", "You're right. This is our first step in Japan. We understand that Japanese companies carefully consider whether a partner can be trusted for the long term, and that is what we value most as well. Somansa has spent 30 years in Korea focused solely on protecting personal and confidential information. We started with five people and have grown to more than 400. We have 10 product lines, all serving one purpose: data protection. We are a company that has dedicated itself to a single field. Leading Korean companies such as LG, SK, and Lotte use Somansa products. Korea's major enterprises also look for long-term partners, and they chose Somansa. We intend to build trust in Japan the same way, over the long term."], "dg": false}, {"n": 31, "c": "company", "ko": ["해외 고객은 어떻게 지원합니까?", "소만사는 LG전자의 미국, 유럽, 중국 법인에 제품을 구축한 경험이 있습니다. 구축 단계에서는 소만사 엔지니어가 현지에 상주하며 설치와 안정화를 직접 수행합니다. 이후 운영 방식은 고객사 상황에 맞춰 선택하실 수 있습니다. 소만사 서비스 매니저가 현지에 상주하며 운영을 지원하는 방식, 또는 고객사 담당자나 현지 파트너 인력을 소만사가 교육해 자체 운영할 수 있도록 하는 방식입니다. 이후에도 원격 지원은 계속되며, 현장 대응이 필요하면 엔지니어와 개발자가 일본으로 바로 갑니다. 서울과 도쿄는 비행기로 2시간 거리라 거리 문제는 크지 않습니다. 상주 인력 비용은 별도로 협의합니다."], "ja": ["海外のお客様にはどのようなサポートをしていますか？", "ソマンサは、LGエレクトロニクスの米国、欧州、中国の現地法人に製品を導入した実績があります。構築段階では、ソマンサのエンジニアが現地に常駐し、インストールと安定化を直接行います。その後の運用方法は、お客様の状況に合わせてお選びいただけます。ソマンサのサービスマネージャーが現地に常駐して運用を支援する方法、またはお客様のご担当者や現地パートナーの人材をソマンサがトレーニングし、自社で運用できるようにする方法です。その後もリモートサポートは継続し、現地対応が必要な場合はエンジニアと開発者がすぐに日本へ伺います。ソウルと東京は飛行機で2時間の距離のため、距離の問題はほとんどありません。常駐人員の費用は別途ご相談となります。"], "jp": ["카이가이노 오캬쿠사마니와 도노 요-나 사포-토오 시테 이마스카?", "소만사와, 에루지- 에레쿠토로닉쿠스노 베-코쿠, 오-슈-, 츄-고쿠노 겐치 호-진니 세-힌오 도-뉴-시타 짓세키가 아리마스. 코-치쿠 단카이데와, 소만사노 엔지니아가 겐치니 죠-츄-시, 인스토-루토 안테-카오 쵸쿠세츠 오코나이마스. 소노 아토노 운요- 호-호-와, 오캬쿠사마노 죠-쿄-니 아와세테 오에라비 이타다케마스. 소만사노 사-비스 마네-쟈-가 겐치니 죠-츄-시테 운요-오 시엔스루 호-호-, 마타와 오캬쿠사마노 고탄토-샤야 겐치 파-토나-노 진자이오 소만사가 토레-닝구시, 지샤데 운요- 데키루 요-니 스루 호-호-데스. 소노 아토모 리모-토 사포-토와 케-조쿠시, 겐치 타이오-가 히츠요-나 바아이와 엔지니아토 카이하츠샤가 스구니 니혼에 우카가이마스. 소우루토 토-쿄-와 히코-키데 니지칸노 쿄리노 타메, 쿄리노 몬다이와 호톤도 아리마센. 죠-츄- 진인노 히요-와 벳토 고소-단토 나리마스."], "en": ["How do you support overseas customers?", "Somansa has deployed products for LG Electronics' subsidiaries in the US, Europe, and China. During deployment, Somansa engineers stay on site to handle installation and stabilization directly. After that, you can choose how operations are run: a Somansa service manager stationed on site to support operations, or Somansa training your own staff or local partner personnel so you can run it in-house. Remote support continues throughout, and if on-site support is needed, our engineers and developers can come to Japan right away. Seoul and Tokyo are just a two-hour flight apart, so distance is not a real issue. Costs for on-site personnel are discussed separately."], "dg": false}, {"n": 32, "c": "company", "ko": ["일본어 메뉴(관리자 화면)를 지원합니까?", "지원 가능합니다. 현재 관리자 화면은 한국어와 영어로 제공하고 있으며, 그동안 영어권과 중남미 고객을 위해 영어, 스페인어, 포르투갈어(브라질) 현지화를 진행해 왔습니다. 일본어는 한국어와 어순과 문장 구조가 같아 UI 문구를 자연스럽게 옮기기에 유리합니다. 일본 고객 도입 일정에 맞춰 일본어 화면을 제공하겠습니다."], "ja": ["日本語のメニュー（管理画面）に対応していますか？", "対応可能です。現在、管理画面は韓国語と英語で提供しており、これまで英語圏や中南米のお客様向けに、英語、スペイン語、ポルトガル語（ブラジル）のローカライズを行ってきました。日本語は韓国語と語順や文の構造が同じため、UIの文言を自然に置き換えやすい言語です。日本のお客様の導入スケジュールに合わせて、日本語画面をご提供いたします。"], "jp": ["니혼고노 메뉴- (칸리 가멘) 니 타이오-시테 이마스카?", "타이오- 카노-데스. 겐자이, 칸리 가멘와 칸코쿠고토 에-고데 테-쿄-시테 오리, 코레마데 에-고켄야 츄-난베-노 오캬쿠사마 무케니, 에-고, 스페인고, 포루토가루고 (브라지루) 노 로-카라이즈오 옷테 키마시타. 니혼고와 칸코쿠고토 고쥰야 분노 코-조-가 오나지 타메, 유-아이노 몽곤오 시젠니 오키카에야스이 겐고데스. 니혼노 오캬쿠사마노 도-뉴- 스케쥬-루니 아와세테, 니혼고 가멘오 고테-쿄- 이타시마스."], "en": ["Is the admin console available in Japanese?", "Yes, we can support it. The admin console is currently available in Korean and English, and we have localized it into English, Spanish, and Portuguese (Brazil) for customers in English-speaking countries and Latin America. Japanese shares Korean's word order and sentence structure, which makes it well suited to natural UI localization. We will provide a Japanese interface in line with each Japanese customer's deployment schedule."], "dg": false}, {"n": 33, "c": "company", "ko": ["일본어 문서와 마이넘버도 탐지합니까?", "네, 탐지합니다. 소만사의 주요 고객인 한국 대기업들은 대부분 EU, 미국, 중남미, 일본, 동남아에 해외 법인을 두고 있습니다. 이 고객들을 지원하려면 각국의 개인정보 패턴은 필수였고, 소만사는 30년간 이를 축적해 왔습니다. 마이넘버처럼 검증 규칙이 있는 번호는 체크섬으로 실제 유효한 번호인지까지 확인합니다."], "ja": ["日本語の文書やマイナンバーも検知できますか？", "はい、検知できます。ソマンサの主要顧客である韓国の大企業の多くは、EU、米国、中南米、日本、東南アジアに現地法人を持っています。こうしたお客様を支援するには各国の個人情報パターンが不可欠であり、ソマンサは30年間それを蓄積してきました。マイナンバーのように検証ルールがある番号は、チェックサムで実在する有効な番号かどうかまで確認します。"], "jp": ["니혼고노 분쇼야 마이남바-모 켄치 데키마스카?", "하이, 켄치 데키마스. 소만사노 슈요- 코캬쿠데 아루 칸코쿠노 다이키교-노 오-쿠와, 이-유-, 베-코쿠, 츄-난베-, 니혼, 토-난아지아니 겐치 호-진오 못테 이마스. 코-시타 오캬쿠사마오 시엔스루니와 각코쿠노 코진죠-호- 파탄가 후카케츠데 아리, 소만사와 산쥬-넨칸 소레오 치쿠세키시테 키마시타. 마이남바-노 요-니 켄쇼- 루-루가 아루 방고-와, 첵쿠사무데 짓자이스루 유-코-나 방고-카 도-카마데 카쿠닌시마스."], "en": ["Can it detect Japanese documents and My Number?", "Yes. Most of Somansa's key customers are major Korean enterprises with subsidiaries in the EU, the US, Latin America, Japan, and Southeast Asia. Supporting them required personal data patterns for each country, and Somansa has built these up over 30 years. For numbers with validation rules, such as My Number, a checksum confirms whether the number is actually valid."], "dg": false}, {"n": 34, "c": "company", "ko": ["어떤 고객사가 쓰고 있습니까?", "국세청, 감사원, 국가유산청, 서울특별시, 우리은행, KB국민은행, 하나은행, 카카오뱅크, LG유플러스 등이 사용하고 있습니다. 한국 1금융권 대형 은행 10곳 중 8곳이 소만사 제품을 사용하고 있습니다. 본 제품은 제1금융권 최초 도입 사례이기도 하며, N2SF(국가망 보안체계) 요건에도 맞춰져 있습니다."], "ja": ["どのような企業・機関が導入していますか？", "韓国の国税庁、監査院、国家遺産庁、ソウル特別市、ウリィ銀行、KB国民銀行、ハナ銀行、カカオバンク、LG U+などが導入しています。韓国の第一金融圏の大手銀行10行のうち8行がソマンサの製品を使用しており、本製品は第一金融圏で初めて導入された事例でもあります。また、韓国の国家ネットワークセキュリティ体系（N2SF）の要件にも対応しています。"], "jp": ["도노 요-나 키교-・키칸가 도-뉴-시테 이마스카?", "칸코쿠노 코쿠제-쵸-, 칸사인, 콕카 이산쵸-, 소우루 토쿠베츠시, 우리 깅코-, 케-비- 코쿠민 깅코-, 하나 깅코-, 카카오 반쿠, 에루지- 유-푸라스 나도가 도-뉴-시테 이마스. 칸코쿠노 다이이치 킨유-켄노 오-테 깅코- 쥬-코-노 우치 하치코-가 소만사노 세-힌오 시요-시테 오리, 혼세-힌와 다이이치 킨유-켄데 하지메테 도-뉴-사레타 지레-데모 아리마스. 마타, 칸코쿠노 콕카 넷토와-쿠 세큐리티 타이케- (에누츠-에스에후) 노 요-켄니모 타이오-시테 이마스."], "en": ["Which organizations use it?", "Users include Korea's National Tax Service, Board of Audit and Inspection, Korea Heritage Service, Seoul Metropolitan Government, Woori Bank, KB Kookmin Bank, Hana Bank, KakaoBank, and LG Uplus. Eight of Korea's ten major commercial banks use Somansa products, and this product was the first of its kind adopted by a major Korean commercial bank. It also meets the requirements of Korea's National Network Security Framework (N2SF)."], "dg": false}, {"n": 35, "c": "company", "ko": ["글로벌 제품과 무엇이 다릅니까?", "소만사는 30년간 개인정보와 기밀정보 보호, 한 분야에만 집중해 왔습니다. 외부 투자 규모로 성장한 회사가 아니라, 오랜 시간 스스로 기술 개발을 꾸준히 이어오며 기술을 축적해 온 회사입니다. 그래서 체크섬 기반 개인정보 정밀 탐지, 메신저 형태의 대화 재현, 온프레미스 구축처럼 현장에서 검증된 기술의 밀도가 높습니다. 한 분야에서 오랜 시간 기술을 쌓아 신뢰로 승부한다는 점에서, 소만사는 일본 기업이 중요하게 여기는 가치와 같은 방향을 보고 있다고 생각합니다."], "ja": ["グローバル製品と何が違うのですか？", "ソマンサは30年間、個人情報と機密情報の保護という一つの分野に専念してきました。外部からの投資で規模を拡大してきた会社ではなく、長い時間をかけて自ら技術開発を続け、技術を積み重ねてきた会社です。そのため、チェックサムによる個人情報の精密な検知、メッセンジャー形式の会話再現、オンプレミス構築など、現場で検証された技術の密度が高いと自負しています。一つの分野で長い時間をかけて技術を磨き、信頼で勝負するという点で、ソマンサは日本の企業が大切にされている価値観と同じ方向を向いていると考えています。"], "jp": ["구로-바루 세-힌토 나니가 치가우노데스카?", "소만사와 산쥬-넨칸, 코진죠-호-토 키미츠죠-호-노 호고토 이우 히토츠노 분야니 센넨시테 키마시타. 가이부카라노 토-시데 키보오 카쿠다이시테 키타 카이샤데와 나쿠, 나가이 지칸오 카케테 미즈카라 기쥬츠 카이하츠오 츠즈케, 기쥬츠오 츠미카사네테 키타 카이샤데스. 소노 타메, 첵쿠사무니 요루 코진죠-호-노 세-미츠나 켄치, 멧센쟈- 케-시키노 카이와 사이겐, 온프레미스 코-치쿠 나도, 겐바데 켄쇼-사레타 기쥬츠노 미츠도가 타카이토 지후시테 이마스. 히토츠노 분야데 나가이 지칸오 카케테 기쥬츠오 미가키, 신라이데 쇼-부스루토 이우 텐데, 소만사와 니혼노 키교-가 다이세츠니 사레테 이루 카치칸토 오나지 호-코-오 무이테 이루토 캉가에테 이마스."], "en": ["How are you different from global products?", "For 30 years, Somansa has focused on a single field: protecting personal and confidential information. We did not grow by scaling on outside investment; we grew by steadily developing and accumulating our own technology over a long period. As a result, our technology is dense with field-proven capabilities, such as precise checksum-based personal data detection, messenger-style conversation replay, and on-premises deployment. In building technology over many years in one field and competing on trust, we believe Somansa shares the values that Japanese companies hold dear."], "dg": false}, {"n": 36, "c": "company", "ko": ["가격과 라이선스 체계는 어떻게 됩니까?", "도입 후 1년간은 무상으로 유지보수를 제공하고, 2년 차부터 유지보수 계약으로 운영합니다. 유지보수 요율은 도입 시 함께 안내드립니다. 라이선스는 사용자 수 기준과 트래픽 기준 중에서 선택하실 수 있습니다. 소만사는 트래픽 기준을 권장합니다. 인원이 늘거나 조직이 바뀌어도 라이선스를 다시 조정할 필요가 없어 관리가 편리하기 때문입니다. 구체적인 견적은 고객사 환경을 확인한 뒤 별도로 드리겠습니다."], "ja": ["価格とライセンス体系はどのようになっていますか？", "導入後1年間は無償で保守を提供し、2年目からは保守契約に基づいて運用します。保守料率は導入時にあわせてご案内いたします。ライセンスは、ユーザー数ベースとトラフィックベースからお選びいただけます。ソマンサではトラフィックベースをおすすめしています。人員が増えたり組織が変わったりしてもライセンスを見直す必要がなく、管理しやすいためです。具体的なお見積もりは、お客様の環境を確認したうえで別途ご提示いたします。"], "jp": ["카카쿠토 라이센스 타이케-와 도노 요-니 낫테 이마스카?", "도-뉴-고 이치넨칸와 무쇼-데 호슈오 테-쿄-시, 니넨메카라와 호슈 케-야쿠니 모토즈이테 운요-시마스. 호슈 료-리츠와 도-뉴-지니 아와세테 고안나이 이타시마스. 라이센스와, 유-자-스- 베-스토 토라픽쿠 베-스카라 오에라비 이타다케마스. 소만사데와 토라픽쿠 베-스오 오스스메시테 이마스. 진인가 후에타리 소시키가 카왓타리 시테모 라이센스오 미나오스 히츠요-가 나쿠, 칸리 시야스이 타메데스. 구타이테키나 오미츠모리와, 오캬쿠사마노 칸쿄-오 카쿠닌시타 우에데 벳토 고테-지 이타시마스."], "en": ["What are the pricing and licensing models?", "Maintenance is free for the first year after deployment, and from the second year it runs under a maintenance contract. We'll share the maintenance rate at the time of deployment. Licensing can be based on either the number of users or traffic volume. We recommend traffic-based licensing, since you won't need to adjust licenses as headcount grows or the organization changes, which makes management easier. We'll provide a specific quote separately after reviewing your environment."], "dg": false}];
const CATS = ["detect","scope","deploy","audit","company"];
const UI = {
  ja:{sub:"よくあるご質問　気になる質問をタップしてください",all:"すべて",ph:"キーワードで検索",none:"該当する質問はありません",
      foot:"ご不明な点はスタッフにお気軽にお声がけください",
      cat:{detect:"検知の仕組み",scope:"制御範囲",deploy:"導入・運用",audit:"監査・ログ",company:"会社・サポート"},
      layers:[["外部の生成AI","ChatGPT・Claude・Gemini など",""],["ネットワーク層","社外へ出るデータを検査","AI DLP"],["エンドポイント層","社内LLM・AIエージェントとのやり取り","AIDR"]]},
  en:{sub:"Frequently asked questions. Tap a question to see the answer.",all:"All",ph:"Search by keyword",none:"No matching questions",
      foot:"Please feel free to ask our staff anything.",
      cat:{detect:"Detection",scope:"Coverage",deploy:"Deployment",audit:"Audit & Logs",company:"Company & Support"},
      layers:[["External generative AI","ChatGPT, Claude, Gemini and more",""],["Network layer","Inspects data leaving the company","AI DLP"],["Endpoint layer","Traffic with in-house LLMs and AI agents","AIDR"]]},
  ko:{sub:"자주 묻는 질문 · 궁금한 질문을 눌러 보세요",all:"전체",ph:"키워드로 검색",none:"해당하는 질문이 없습니다",
      foot:"궁금한 점은 스태프에게 편하게 물어보세요",
      cat:{detect:"탐지 방식",scope:"통제 범위",deploy:"구축·운영",audit:"감사·로그",company:"회사·지원"},
      layers:[["외부 생성형 AI","ChatGPT·Claude·Gemini 등",""],["네트워크 계층","회사 밖으로 나가는 데이터 검사","AI DLP"],["엔드포인트 계층","사내 LLM·AI 에이전트와 오가는 데이터","AIDR"]]}
};
const st = {lang:"ja", cat:"all", q:"", pron:false};
try{ st.pron = localStorage.getItem("pron")==="1"; }catch(e){}
const $ = s=>document.querySelector(s);
const esc = s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const paras = t=>t.split(/(?<=[。.!?！？])\s*(?=\S)/).reduce((acc,s)=>{ // group ~2 sentences per paragraph
  const last=acc[acc.length-1]; if(last && last.length<90) acc[acc.length-1]=last+(st.lang==="ja"?"":" ")+s; else acc.push(s); return acc;},[])
  .map(p=>`<p>${esc(p)}</p>`).join("");

function layers(){
  const L=UI[st.lang].layers;
  return `<div class="layers" aria-label="layers">${L.map((l,i)=>`<div class="lay ${["ext","net","end"][i]}"><div><div class="t">${esc(l[0])}</div><div class="d">${esc(l[1])}</div></div>${l[2]?`<span class="tag">${l[2]}</span>`:""}</div>`).join("")}</div>`;
}

function render(){
  const u=UI[st.lang];
  document.body.dataset.lang=st.lang;
  document.documentElement.lang=st.lang;
  $("#sub").textContent=u.sub; $("#foot").textContent=u.foot; $("#q").placeholder=u.ph;
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===st.lang));
  // chips
  const counts={}; DATA.forEach(d=>counts[d.c]=(counts[d.c]||0)+1);
  $("#chips").innerHTML=[["all",u.all,DATA.length],...CATS.map(c=>[c,u.cat[c],counts[c]])]
    .map(([k,l,n])=>`<button type="button" class="chip" data-c="${k}" aria-pressed="${st.cat===k}">${esc(l)}<span class="ct">${n}</span></button>`).join("");
  // list
  const kw=st.q.trim().toLowerCase();
  const items=DATA.filter(d=>(st.cat==="all"||d.c===st.cat) && (!kw || (d[st.lang][0]+d[st.lang][1]).toLowerCase().includes(kw)));
  if(!items.length){ $("#out").innerHTML=`<p class="empty">${u.none}</p>`; return; }
  const groups=CATS.filter(c=>items.some(d=>d.c===c));
  $("#out").innerHTML=groups.map(c=>`<section class="group"><h2>${esc(u.cat[c])}</h2><div class="list">${
    items.filter(d=>d.c===c).map(d=>{
      const [q,a]=d[st.lang]; const showP=st.pron&&st.lang==="ja";
      return `<details class="qa" id="q${d.n}"><summary><span class="num">${String(d.n).padStart(2,"0")}</span><span class="q">${esc(q)}${showP?`<div class="qp">${esc(d.jp[0])}</div>`:""}</span><span class="mark" aria-hidden="true"></span></summary>
      <div class="ans">${paras(a)}${d.dg?layers():""}${showP?`<div class="ap"><b>読み · 한글 발음</b>${esc(d.jp[1])}</div>`:""}</div></details>`;}).join("")}</div></section>`).join("");
}

// keep open item open across language switches
function openIds(){return [...document.querySelectorAll("details[open]")].map(e=>e.id);}
function reopen(ids){ids.forEach(id=>{const e=document.getElementById(id); if(e) e.open=true;});}

document.addEventListener("click",e=>{
  const lb=e.target.closest(".lang button");
  if(lb){const ids=openIds(); st.lang=lb.dataset.l; render(); reopen(ids); return;}
  const ch=e.target.closest(".chip");
  if(ch){st.cat=ch.dataset.c; render(); window.scrollTo({top:0,behavior:"smooth"}); return;}
});
// one answer open at a time keeps the screen readable for visitors
document.addEventListener("toggle",e=>{
  const t=e.target; if(!(t instanceof HTMLDetailsElement)||!t.open) return;
  document.querySelectorAll("details[open]").forEach(d=>{if(d!==t) d.open=false;});
  setTimeout(()=>{const r=t.getBoundingClientRect(); const bar=document.querySelector(".bar").offsetHeight;
    if(r.top<bar+8 || r.top>innerHeight*0.6) window.scrollBy({top:r.top-bar-12,behavior:"smooth"});},30);
},true);
$("#q").addEventListener("input",e=>{st.q=e.target.value; const ids=openIds(); render(); reopen(ids);});
$("#pron").checked=st.pron;
$("#pron").addEventListener("change",e=>{st.pron=e.target.checked; try{localStorage.setItem("pron",st.pron?"1":"0")}catch(_){}; const ids=openIds(); render(); reopen(ids);});

// booth kiosk: after 2 minutes idle, close answers, clear search, return to the top (language stays)
let idle; function bump(){clearTimeout(idle); idle=setTimeout(()=>{
  st.cat="all"; st.q=""; $("#q").value=""; render(); window.scrollTo({top:0});},120000);}
["pointerdown","keydown","scroll"].forEach(ev=>addEventListener(ev,bump,{passive:true})); bump();

// keep the iPad screen on while the page is visible
let lock; async function wake(){try{ if("wakeLock" in navigator && document.visibilityState==="visible") lock=await navigator.wakeLock.request("screen"); }catch(e){} }
document.addEventListener("visibilitychange",wake); wake();

render();
</script>
