<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>김현정 업무용 깃허브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f7f6f3;--ink:#22335b;--line:#c9cfdc}
  @media (prefers-color-scheme: dark){:root{--bg:#14171f;--ink:#dfe5f2;--line:#3a4256}}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;
       font-family:'Noto Serif KR','Apple SD Gothic Neo',serif;padding:24px;box-sizing:border-box}
  h1{margin:0;font-weight:700;font-size:clamp(26px,6vw,44px);letter-spacing:-0.02em;text-align:center;line-height:1.35}
  h1::after{content:"";display:block;width:48px;height:2px;background:var(--line);margin:22px auto 0}
</style>
</head>
<body>
  <h1>김현정 업무용 깃허브</h1>
</body>
</html>
